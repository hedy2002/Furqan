    <script>
        const baseSahih = [
            { matn: "إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى", translation: "کردەوەکان بەپێی نیەتەکان دەپێورێن، و بۆ هەر کەسێک ئەوەیە کە نیەتی هێناوە.", narrator: "عومەری کوڕی خەتتاب", collector: "صحيح البخاري ومسلم" },
            { matn: "لا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ", translation: "هیچ یەکێک لە ئێوە بە تەواوی ئیماندار نابێت تا ئەوەی بۆ خۆی حەزی پێدەکات بۆ برایەکەشی حەزی پێبکات.", narrator: "ئەنەسی کوڕی مالیک", collector: "صحيح البخاري" }
        ];

        const baseHasan = [
            { matn: "اتَّقِ اللَّهِ حَيْثُمَا كُنْتَ، وَأَتْبِعِ السَّيِّئَةَ الْحَسَنَةَ تَمْحُهَا", translation: "لە هرکوێ بوویت لە خدا بترسە، و بەدوای گوناهدا چاکەیەک بکە تا بیسڕێتەوە.", narrator: "ئەبو زەر", collector: "سنن الترمذي" }
        ];

        const baseDaif = [
            { matn: "اطْلُبُوا الْعِلْمَ وَلَوْ بِالصِّينِ", translation: "داوای زانست بکەن تەنانەت ئەگەر لە چین-یش بێت.", narrator: "ئەنەسی کوڕی مالیک", collector: "ضعيف الجامع" }
        ];

        const generateHadiths = () => {
            const result = [];
            let currentId = 1;
            const buildGradeList = (baseList, gradeName) => {
                for (let i = 0; i < 100; i++) {
                    const sample = baseList[i % baseList.length];
                    result.push({
                        id: currentId++,
                        matn: sample.matn + (i >= baseList.length ? ` (${i + 1})` : ''),
                        translation: sample.translation,
                        narrator: sample.narrator,
                        collector: sample.collector,
                        grade: gradeName
                    });
                }
            };
            buildGradeList(baseSahih, "صحيح");
            buildGradeList(baseHasan, "حسن");
            buildGradeList(baseDaif, "ضعيف");
            return result;
        };

        const hadiths = generateHadiths();

        // COMPREHENSIVE AZKAR DATA
        const defaultAzkar = [
            // --- ☀️ زیکری بەیانیان ---
            { id: 'm1', type: 'morning', title: 'سەیدولئستغفار', text: 'اللَّهُمَّ أَنْتَ رَبِّي لا إِلَهَ إِلا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لا يَغْفِرُ الذُّنُوبَ إِلا أَنْتَ.', target: 1, isDefault: true },
            { id: 'm2', type: 'morning', title: 'ئایەتی الکرسي', text: '﴿اللَّهُ لَا إِلَـٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ﴾', target: 1, isDefault: true },
            { id: 'm3', type: 'morning', title: 'سوپاسی بەیانیان', text: 'أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ...', target: 1, isDefault: true },
            { id: 'm4', type: 'morning', title: 'ڕەزامەندی بە پەروەردگار', text: 'رَضِيتُ بِاللَّهِ رَبًّا، وَبِالإِسْلامِ دِينًا، وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا.', target: 3, isDefault: true },
            { id: 'm5', type: 'morning', title: 'پاراستن لە شەڕی مەخلووقات', text: 'أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ.', target: 3, isDefault: true },
            { id: 'm6', type: 'morning', title: 'پاراستن لە زەرەر و زیان', text: 'بِسْمِ اللَّهِ الَّذِي لا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الأَرْضِ وَلا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ.', target: 3, isDefault: true },
            { id: 'm7', type: 'morning', title: 'داوای عافیەت و پاراستن', text: 'اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالآخِرَةِ...', target: 1, isDefault: true },
            { id: 'm8', type: 'morning', title: 'بەخشینی نیعمەتی بەیانی', text: 'اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لا شَرِيكَ لَكَ...', target: 1, isDefault: true },
            { id: 'm9', type: 'morning', title: 'تەسبێحی بەیانیان', text: 'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ.', target: 3, isDefault: true },
            { id: 'm10', type: 'morning', title: 'داوای فریادڕەسی (یا حی يا قيوم)', text: 'يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ.', target: 1, isDefault: true },
            { id: 'm11', type: 'morning', title: 'سەڵاوات دان لەسەر پێغەمبەر ﷺ', text: 'اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ.', target: 10, isDefault: true },
            { id: 'm12', type: 'morning', title: 'تەسبێحی ١٠٠ جار', text: 'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ.', target: 100, isDefault: true },
            { id: 'm13', type: 'morning', title: 'داوای زانستی بەسوود و ڕزقی حەڵاڵ', text: 'اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلاً مُتَقَبَّلاً.', target: 1, isDefault: true },
            { id: 'm14', type: 'morning', title: 'سوپاسگوزاری سروشت', text: 'أَصْبَحْنَا عَلَى فِطْرَةِ الإِسْلامِ، وَعَلَى كَلِمَةِ الإِخْلاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ.', target: 1, isDefault: true },
            { id: 'm15', type: 'morning', title: 'سورەتی الإخلاص، الفلق، والناس', text: 'خوێندنی سێ سورەتەکە (قُلْ هُوَ اللَّهُ أَحَدٌ...)، (قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ...)، (قُلْ أَعُوذُ بِرَبِّ النَّاسِ...).', target: 3, isDefault: true },
            { id: 'm16', type: 'morning', title: 'تەوحید و تەکبیر', text: 'لا إِلَهَ إِلا اللَّهُ وَحْدَهُ لا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.', target: 10, isDefault: true },

        function getYouTubeUrls(rawUrl) {
            try {
                const parsedUrl = new URL(rawUrl);
                const host = parsedUrl.hostname.toLowerCase().replace(/^www\./, '');
                const isYouTubeHost = ['youtube.com', 'm.youtube.com', 'youtube-nocookie.com', 'youtu.be'].includes(host);
                if (!isYouTubeHost) return null;

                let videoId = '';
                if (host === 'youtu.be') {
                    videoId = parsedUrl.pathname.split('/').filter(Boolean)[0] || '';
                } else {
                    videoId = parsedUrl.searchParams.get('v') || '';
                    if (!videoId) {
                        const pathMatch = parsedUrl.pathname.match(/^\/(?:embed|shorts|live)\/([^/?]+)/);
                        videoId = pathMatch?.[1] || '';
                    }
                }

                if (!/^[A-Za-z0-9_-]{11}$/.test(videoId)) return null;
                return {
                    embedUrl: `https://www.youtube-nocookie.com/embed/${videoId}?rel=0`,
                    watchUrl: `https://www.youtube.com/watch?v=${videoId}`
                };
            } catch {
                return null;
            }
        }

        let activeSpeechStatusId = '';

        function setSpeechStatus(message) {
            if (!activeSpeechStatusId) return;
            const status = document.getElementById(activeSpeechStatusId);
            if (status) status.textContent = message;
        }

        function getNarrationText(section, id) {
            if (section === 'seerah') {
                const chapter = window.FurqanStories.seerah.find(item => item.id === id);
                return chapter ? `${chapter.title}. ${chapter.text}` : '';
            }
            const prophet = window.FurqanStories.prophets.find(item => item.id === id);
            return prophet ? `${prophet.name}. ژیاننامە: ${prophet.life} نیشانەکان: ${prophet.signs} وانەکان: ${prophet.lessons}` : '';
        }

        function playNarration(section, id) {
            if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
                activeSpeechStatusId = `speech-status-${section}-${id}`;
                setSpeechStatus('خوێندنەوەی دەنگی لەم وێبگەڕەدا بەردەست نییە.');
                return;
            }

            const text = getNarrationText(section, id);
            if (!text) return;

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ckb-IQ';
            utterance.rate = 0.9;
            const kurdishVoice = window.speechSynthesis.getVoices().find(voice => /^(ckb|ku)(-|$)/i.test(voice.lang));
            if (kurdishVoice) utterance.voice = kurdishVoice;

            activeSpeechStatusId = `speech-status-${section}-${id}`;
            activeSpeechUtterance = utterance;
            utterance.onend = () => {
                if (activeSpeechUtterance !== utterance) return;
                setSpeechStatus('خوێندنەوە تەواو بوو.');
                activeSpeechUtterance = null;
            };
            utterance.onerror = () => {
                if (activeSpeechUtterance !== utterance) return;
                setSpeechStatus('خوێندنەوەی دەنگی لەم وێبگەڕەدا پشتگیری ناکرێت.');
                activeSpeechUtterance = null;
            };
            setSpeechStatus(kurdishVoice ? 'خوێندنەوە دەستی پێکرد.' : 'خوێندنەوە دەستی پێکرد؛ دەنگی کوردی لە هەموو ئامێرێکدا بەردەست نییە.');
            window.speechSynthesis.speak(utterance);
        }

        function pauseNarration() {
            if (!('speechSynthesis' in window) || !window.speechSynthesis.speaking) return;
            window.speechSynthesis.pause();
            setSpeechStatus('خوێندنەوە ڕاگیراوە.');
        }

        function resumeNarration() {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.resume();
            setSpeechStatus('خوێندنەوە بەردەوامە.');
        }

        function stopNarration() {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            setSpeechStatus('خوێندنەوە وەستێنرا.');
            activeSpeechUtterance = null;
            activeSpeechStatusId = '';
        }

        function useCurrentPrayerLocation() {

                    3: 'وەرگرتنی شوێن زۆر خایاند؛ دووبارە هەوڵ بدەرەوە.'
                };
                status.textContent = messages[error.code] || 'شوێن وەرنەگیرا؛ تکایە شارێک هەڵبژێرە.';

        async function setPrayerNotifications(enabled) {
            const toggle = document.getElementById('prayerNotificationsToggle');
            if (!enabled) {
                prayerNotificationsEnabled = false;
                localStorage.setItem('prayer_notifications_enabled', 'false');
                setPrayerSettingsStatus('ئاگادارکردنەوە ناچالاکە.');
                return;
            }

            if (!('Notification' in window)) {
                toggle.checked = false;
                setPrayerSettingsStatus('ئەم وێبگەڕە ئاگادارکردنەوە پشتگیری ناکات.');
                return;
            }

            let permission = Notification.permission;
            if (permission === 'default') permission = await Notification.requestPermission();
            if (permission !== 'granted') {
                toggle.checked = false;
                prayerNotificationsEnabled = false;
                localStorage.setItem('prayer_notifications_enabled', 'false');
                setPrayerSettingsStatus('بۆ ئاگادارکردنەوە، ڕێگەپێدانی وێبگەڕ پێویستە.');
                return;
            }

            prayerNotificationsEnabled = true;
            localStorage.setItem('prayer_notifications_enabled', 'true');
            setPrayerSettingsStatus('ئاگادارکردنەوە چالاکە؛ ئەپەکە بۆ وەرگرتنی ئاگادارکردنەوە بهێڵەوە کراوە.');
        }

        async function setPrayerSound(enabled) {
            const toggle = document.getElementById('prayerSoundToggle');
            if (!enabled) {
                prayerSoundEnabled = false;
                localStorage.setItem('prayer_sound_enabled', 'false');
                if (prayerAudioContext) {
                    await prayerAudioContext.close();
                    prayerAudioContext = null;
                }
                setPrayerSettingsStatus('دەنگی ئاگادارکردنەوە ناچالاکە.');
                return;
            }

            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) {
                toggle.checked = false;
                setPrayerSettingsStatus('ئەم وێبگەڕە دەنگی ئاگادارکردنەوە پشتگیری ناکات.');
                return;
            }

            try {
                prayerAudioContext = prayerAudioContext || new AudioContextClass();
                await prayerAudioContext.resume();
                prayerSoundEnabled = true;
                localStorage.setItem('prayer_sound_enabled', 'true');
                setPrayerSettingsStatus('دەنگی ئاگادارکردنەوە چالاکە؛ تۆنێکی کورت لە کاتی بانگدا لێدەدرێت.');
                playPrayerTone();
            } catch {
                prayerSoundEnabled = false;
                toggle.checked = false;
                setPrayerSettingsStatus('دەنگ چالاک نەکرا؛ تکایە لە وێبگەڕەکە ڕێگەی پێبدە.');
            }
        }

        function playPrayerTone() {
            if (!prayerAudioContext || prayerAudioContext.state !== 'running') return;
            const startTime = prayerAudioContext.currentTime;
            [660, 880, 660].forEach((frequency, index) => {
                const start = startTime + index * 0.28;
                const oscillator = prayerAudioContext.createOscillator();
                const gain = prayerAudioContext.createGain();
                oscillator.frequency.value = frequency;
                oscillator.type = 'sine';
                gain.gain.setValueAtTime(0.0001, start);
                gain.gain.exponentialRampToValueAtTime(0.12, start + 0.04);
                gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.22);
                oscillator.connect(gain);
                gain.connect(prayerAudioContext.destination);
                oscillator.start(start);
                oscillator.stop(start + 0.23);
            });
        }

        function notifyPrayerTime(prayerName, prayerCode, dateKey) {
            if (prayerSoundEnabled) playPrayerTone();
            if (!prayerNotificationsEnabled || Notification.permission !== 'granted') return;

            const options = {
                body: `کاتی ${prayerName}یە.`,
                icon: '/icon-192.png',
                tag: `prayer-${dateKey}-${prayerCode}`,
                renotify: false
            };
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.ready
                    .then(registration => registration.showNotification('کاتی بانگ', options))
                    .catch(() => {});
            }
        }

        function getDateKeyInTimeZone(date, timeZone) {
            const dateParts = new Intl.DateTimeFormat('en-US', {
                timeZone,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).formatToParts(date);
            const values = Object.fromEntries(dateParts.map(part => [part.type, part.value]));
            return `${values.year}-${values.month}-${values.day}`;
        }

        function checkPrayerNotifications(prayerTimes, timeZone) {
            const now = new Date();
            const dateKey = getDateKeyInTimeZone(now, timeZone);
            if (alertedPrayerDate !== dateKey) {
                alertedPrayerDate = dateKey;
                alertedPrayerKeys = new Set();
            }

            const prayerAlerts = [
                { code: 'fajr', name: 'بەیانی', time: prayerTimes.fajr },
                { code: 'dhuhr', name: 'نیوەڕۆ', time: prayerTimes.dhuhr },
                { code: 'asr', name: 'عەسر', time: prayerTimes.asr },
                { code: 'maghrib', name: 'مەغریب', time: prayerTimes.maghrib },
                { code: 'isha', name: 'عیشا', time: prayerTimes.isha }
            ];

            prayerAlerts.forEach(prayer => {
                const elapsed = now.getTime() - prayer.time.getTime();
                const key = `${dateKey}-${prayer.code}`;
                if (elapsed >= 0 && elapsed < 60000 && !alertedPrayerKeys.has(key)) {
                    alertedPrayerKeys.add(key);
                    notifyPrayerTime(prayer.name, prayer.code, dateKey);
                }
            });
        }

        function updatePrayerTimesUI() {
            if (!window.adhan) return;

            const location = currentPrayerLocation || {
                name: citiesData[selectedCityKey].name,
                latitude: citiesData[selectedCityKey].lat,
                longitude: citiesData[selectedCityKey].lng
            };
            const coordinates = new adhan.Coordinates(location.latitude, location.longitude);
            const prayerTimeZone = currentPrayerLocation
                ? (Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC')
                : 'Asia/Baghdad';
            const dateParts = new Intl.DateTimeFormat('en-US', {
                timeZone: prayerTimeZone,
                year: 'numeric',
                month: 'numeric',
                day: 'numeric'
            }).formatToParts(new Date());
            const dateValues = Object.fromEntries(dateParts.map(part => [part.type, part.value]));
            const date = new Date(Number(dateValues.year), Number(dateValues.month) - 1, Number(dateValues.day));
            const calculationMethod = adhan.CalculationMethod[prayerCalculationMethod] || adhan.CalculationMethod.MuslimWorldLeague;
            const params = calculationMethod();
            params.madhab = prayerAsrMethod === 'Hanafi' ? adhan.Madhab.Hanafi : adhan.Madhab.Shafi;
            const prayerTimes = new adhan.PrayerTimes(coordinates, date, params);
            checkPrayerNotifications(prayerTimes, prayerTimeZone);

            const list = [
                { name: 'بەیانی', time: prayerTimes.fajr, code: 'fajr' },
                { name: 'کەلهۆڕ (ڕۆژهەڵاتن)', time: prayerTimes.sunrise, code: 'sunrise' },
                { name: 'نیوەڕۆ', time: prayerTimes.dhuhr, code: 'dhuhr' },
                { name: 'عەسر', time: prayerTimes.asr, code: 'asr' },
                { name: 'مەغریب', time: prayerTimes.maghrib, code: 'maghrib' },
                { name: 'عیشا', time: prayerTimes.isha, code: 'isha' }
            ];

            const mainPrayerList = list.filter(prayer => prayer.code !== 'sunrise');
            const currentTime = new Date();
            let nextPrayerEntry = mainPrayerList.find(prayer => prayer.time > currentTime);
            if (!nextPrayerEntry) {
                const tomorrow = new Date(date.getFullYear(), date.getMonth(), date.getDate() + 1);
                const tomorrowTimes = new adhan.PrayerTimes(coordinates, tomorrow, params);
                nextPrayerEntry = { code: 'fajr', name: 'بەیانی', time: tomorrowTimes.fajr };
            }
            const nextPrayerCode = nextPrayerEntry.code;
            const prayerCardsContainer = document.getElementById('prayerCardsContainer');
            if (!prayerCardsContainer) return;

            let cardsHtml = '';
            list.forEach(p => {
                const isNext = (p.code === nextPrayerCode);
                const timeStr = new Intl.DateTimeFormat('ar-IQ', {
                    timeZone: prayerTimeZone,
                    hour: '2-digit',
                    minute: '2-digit'
                }).format(p.time);
                cardsHtml += `
                    <div class="p-4 rounded-xl border ${isNext ? 'bg-amber-50 border-amber-400 ring-2 ring-amber-300' : 'bg-slate-50 border-slate-200'} text-center transition">
                        <span class="text-xs font-semibold ${isNext ? 'text-amber-800' : 'text-slate-500'}">${p.name}</span>
                        <div class="text-lg font-bold ${isNext ? 'text-amber-900' : 'text-slate-800'} mt-1">${timeStr}</div>
                    </div>
                `;
            });
            prayerCardsContainer.innerHTML = cardsHtml;

            // Next Prayer Countdown
            const nextPrayerTime = nextPrayerEntry.time;
            const countdownEl = document.getElementById('nextPrayerCountdown');
            if (nextPrayerTime && countdownEl) {
                const diff = nextPrayerTime - new Date();
                if (diff > 0) {
                    const hrs = Math.floor(diff / (1000 * 60 * 60));
                    const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const secs = Math.floor((diff % (1000 * 60)) / 1000);
                    countdownEl.innerText = `کاتی بانگی ${nextPrayerEntry.name}ی داهاتوو: ${hrs} کاتژمێر و ${mins} خولەک و ${secs} چرکە`;
                }
            }

            // Qibla Angle
            const qiblaDegrees = adhan.Qibla(coordinates);
            const qiblaTextEl = document.getElementById('qiblaAngleText');
            if (qiblaTextEl) {
                qiblaTextEl.innerText = `ئاڕاستەی قیبلە بۆ ${location.name}: ${Math.round(qiblaDegrees)} پلە (لە باکوورەوە بەپێی سەعات)`;
            }
        }

        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert("دەقەکە بەسەرکەوتوویی کۆپی کرا!");
            });
        }

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            switchTab('صحيح');
        });
    </script>
    <script>
        (() => {
            const installButton = document.getElementById('installAppButton');
            const iosDialog = document.getElementById('iosInstallDialog');
            const iosCloseButton = document.getElementById('closeIosInstallDialog');
            const iosDoneButton = document.getElementById('doneIosInstallDialog');
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
            const isIOS = /iPhone|iPad|iPod/.test(window.navigator.userAgent) || (window.navigator.platform === 'MacIntel' && window.navigator.maxTouchPoints > 1);
            let installPromptEvent = null;

            if (window.lucide) window.lucide.createIcons();

            if (!isStandalone && isIOS) installButton.hidden = false;

            window.addEventListener('beforeinstallprompt', event => {
                event.preventDefault();
                installPromptEvent = event;
                installButton.hidden = false;
            });

            installButton.addEventListener('click', async () => {
                if (installPromptEvent) {
                    await installPromptEvent.prompt();
                    const choice = await installPromptEvent.userChoice;
                    installPromptEvent = null;
                    if (choice.outcome === 'accepted') installButton.hidden = true;
                    return;
                }

                if (isIOS && typeof iosDialog.showModal === 'function') iosDialog.showModal();
            });

            const closeIOSDialog = () => iosDialog.close();
            iosCloseButton.addEventListener('click', closeIOSDialog);
            iosDoneButton.addEventListener('click', closeIOSDialog);

            window.addEventListener('appinstalled', () => {
                installPromptEvent = null;
                installButton.hidden = true;
            });

            if ('serviceWorker' in navigator) {
                let hadController = Boolean(navigator.serviceWorker.controller);
                let reloadingForWorkerUpdate = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (!hadController) {
                        hadController = true;
                        return;
                    }
                    if (!reloadingForWorkerUpdate) {
                        reloadingForWorkerUpdate = true;
                        window.location.reload();
                    }
                });

                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/service-worker.js')
                        .then(registration => registration.update())
                        .catch(error => console.error('Service worker registration failed:', error));
                });
            }
        })();
    </script>
